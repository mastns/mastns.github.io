# Keeps https://mastrogeorgiou.gr/ an exact copy of this site (its canonical is
# https://mastns.github.io/). Uploads over FTPS to the Papaki/Plesk hosting.
# Needs repository secrets FTP_USERNAME and FTP_PASSWORD; skips cleanly without them.
name: Deploy copy to mastrogeorgiou.gr

on:
  push:
    branches: [master]
    paths:
      - index.html
      - favicon.ico
      - google204242c25d647ff0.html
      - assets/**
      - .github/workflows/deploy-mastrogeorgiou-gr.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-mastrogeorgiou-gr
  cancel-in-progress: false

jobs:
  deploy:
    # Not ubuntu-latest (24.04): its curl 8.5 can truncate FTPS uploads over TLS 1.3,
    # a curl known bug fixed in 8.9.
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      # Connect through the domain's FTP name. The server's certificate is for *.papaki.gr,
      # so TLS checks it under the server's own papaki.gr name (the same machine).
      FTP_HOST: ${{ vars.FTP_HOST || 'ftp.mastrogeorgiou.gr' }}
      FTP_CERT_NAME: ${{ vars.FTP_CERT_NAME || 'linux252.papaki.gr' }}
      SITE_URL: https://mastrogeorgiou.gr/
    steps:
      - name: Check the FTP login is configured
        id: login
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "::notice::FTP_USERNAME / FTP_PASSWORD secrets are not set, so nothing was uploaded."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [[ "$FTP_USERNAME$FTP_PASSWORD" == *[$'\n\r']* ]]; then
            echo "::error::FTP_USERNAME or FTP_PASSWORD contains a line break; set it again as a single line."
            exit 1
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the site
        if: steps.login.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Upload over FTPS
        if: steps.login.outputs.ready == 'true'
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          curl --version | head -n 1

          # The files that make up the copy: assets first and index.html last,
          # so the live page never points at a missing file.
          mapfile -t files < <(find assets -type f ! -name '.*' | sort)
          files+=(favicon.ico google204242c25d647ff0.html index.html)
          for f in "${files[@]}"; do
            # Plain files with plain names only: a symlink could publish files from the runner
            # (including the FTP login), and %, #, ? or .. would change the FTP path.
            if [ -L "$f" ] || [ ! -f "$f" ]; then
              echo "::error::$f is not a regular file, so nothing was uploaded."
              exit 1
            fi
            case "$f" in
              *[!A-Za-z0-9._/-]*|*..*) echo "::error::Unsafe file name $f, so nothing was uploaded."; exit 1 ;;
            esac
          done
          printf '%s\n' "${files[@]}" > "$RUNNER_TEMP/files.txt"

          cfg="$RUNNER_TEMP/ftp.cfg"
          trap 'rm -f "$cfg"' EXIT
          esc() { printf '%s' "$1" | sed 's/\\/\\\\/g; s/"/\\"/g'; }
          printf 'user = "%s:%s"\n' "$(esc "$FTP_USERNAME")" "$(esc "$FTP_PASSWORD")" > "$cfg"
          # TLS is required for login and data, and the server certificate is verified.
          # URLs carry $FTP_CERT_NAME (the name checked against the certificate); --connect-to
          # sends the connection to $FTP_HOST. --fail-early stops at the first failed transfer.
          ftp() { curl --config "$cfg" --connect-to "$FTP_CERT_NAME::$FTP_HOST:" --ssl-reqd --tlsv1.2 --fail --fail-early --silent --show-error --retry 2 "$@"; }

          # Plesk's main FTP user logs in above httpdocs; an FTP user created for httpdocs logs in inside it.
          # (Listings go into variables first: grep -q exiting early would break the pipe under pipefail.)
          home_list=$(ftp --list-only "ftp://$FTP_CERT_NAME/" | tr -d '\r')
          if grep -qx 'httpdocs' <<<"$home_list"; then dir='httpdocs/'; else dir=''; fi
          # Refuse to upload anywhere that does not already hold the site.
          site_list=$(ftp --list-only "ftp://$FTP_CERT_NAME/$dir" | tr -d '\r')
          if ! grep -qx 'index.html' <<<"$site_list"; then
            echo "::error::No index.html in '/$dir' on $FTP_HOST, so nothing was uploaded."
            exit 1
          fi

          args=()
          for f in "${files[@]}"; do args+=(-T "$f" "ftp://$FTP_CERT_NAME/$dir$f"); done
          ftp --ftp-create-dirs "${args[@]}"
          echo "Uploaded ${#files[@]} files to /$dir on $FTP_HOST"

      - name: Check mastrogeorgiou.gr now matches this commit
        if: steps.login.outputs.ready == 'true'
        run: |
          set -euo pipefail
          mapfile -t files < "$RUNNER_TEMP/files.txt"
          for f in "${files[@]}"; do
            url="$SITE_URL$f"
            [ "$f" = index.html ] && url="$SITE_URL"
            if ! curl --fail --silent --show-error --retry 2 "$url?deploy=$GITHUB_SHA" -o "$RUNNER_TEMP/live" ||
               ! cmp -s "$RUNNER_TEMP/live" "$f"; then
              echo "::error::$url does not match $f in this commit."
              exit 1
            fi
          done
          echo "$SITE_URL serves the same ${#files[@]} files as this commit."
